name: Context Cache

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Context cache mode: full, summaries, claims, or validate"
        required: false
        default: full
      path:
        description: "Optional repository path scope"
        required: false
        default: .

permissions:
  contents: read

jobs:
  context-cache:
    runs-on: ubuntu-latest
    env:
      CONTEXT_CACHE_MODE: ${{ github.event.inputs.mode || 'full' }}
      CONTEXT_CACHE_PATH: ${{ github.event.inputs.path || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build context cache proposal
        run: |
          case "$CONTEXT_CACHE_MODE" in
            claims)
              npm run cli -- context claims refresh --repo-root "$CONTEXT_CACHE_PATH" > context-cache-plan.json
              ;;
            summaries)
              npm run cli -- context summarize --repo-root "$CONTEXT_CACHE_PATH" > context-cache-plan.json
              ;;
            validate)
              npm run cli -- context validate --repo-root "$CONTEXT_CACHE_PATH" > context-cache-plan.json
              ;;
            *)
              npm run cli -- context build --repo-root "$CONTEXT_CACHE_PATH" > context-cache-plan.json
              ;;
          esac
      - name: Validate context cache
        run: npm run cli -- context validate --repo-root "$CONTEXT_CACHE_PATH" > context-cache-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: context-cache-report
          path: |
            context-cache-plan.json
            context-cache-validation.json
