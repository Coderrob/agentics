name: Context Cache Effectiveness

on:
  workflow_dispatch:
    inputs:
      baseline_usage_path:
        description: "Path to the cold-run usage.json file"
        required: true
      candidate_usage_path:
        description: "Path to the cached-run usage.json file"
        required: true
      repo_root:
        description: "Repository root to validate"
        required: false
        default: .

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate context cache
        run: >-
          npm run cli -- context validate --repo-root
          "${{ github.event.inputs.repo_root }}" > context-cache-validation.json
      - name: Benchmark cold versus cached run
        run: >-
          npm run cli -- refine benchmark --baseline
          "${{ github.event.inputs.baseline_usage_path }}" --candidate
          "${{ github.event.inputs.candidate_usage_path }}" > context-cache-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: context-cache-effectiveness
          path: |
            context-cache-validation.json
            context-cache-benchmark.json
